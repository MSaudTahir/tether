[project]
name = "mydevice"
version = "0.1.0"
description = "Simple Android screen viewer and app launcher built on scrcpy"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8", "certifi"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
mydevice = "mydevice.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mydevice"]
