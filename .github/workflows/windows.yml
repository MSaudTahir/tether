# Builds the WinUI app (x64 and ARM64) and checks it starts, when it or the core changes.
# Run it by hand from the Actions tab ("Run workflow") to build regardless.
name: Windows

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "helper/**"
      - "buddy/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "core/**"
      - "helper/**"
      - "buddy/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: C# bindings generator
        uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs*
          key: uniffi-bindgen-cs-v0.10.0-${{ runner.os }}-${{ matrix.arch }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.10.0+v0.29.4
      - name: clang (ring needs it on ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Build Tether.exe
        shell: pwsh
        run: windows\build.ps1 -Arch ${{ matrix.arch }}
      # Starts the app (the setup wizard, with no phone attached) and saves a screenshot: a check
      # that it runs, not just builds.
      - name: Launch and screenshot
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $app = Start-Process "windows\build\Tether-x64\Tether.exe" -PassThru
          Start-Sleep 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $image.Save("$PWD\windows-screenshot.png")
          if ($app.HasExited) {
            Get-Content "$env:LOCALAPPDATA\Tether\crash.log" -ErrorAction SilentlyContinue
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; ProviderName = ".NET Runtime", "Application Error" } -MaxEvents 3 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Message }
            throw "Tether exited with code $($app.ExitCode)"
          }
          Stop-Process $app
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with:
          name: windows-screenshot
          path: windows-screenshot.png
          if-no-files-found: ignore
      # To try a build on a PC: download it from the run's page.
      - uses: actions/upload-artifact@v4
        with:
          name: tether-windows-${{ matrix.arch }}
          path: windows/build/Tether-${{ matrix.arch }}
          retention-days: 14
