[package]
name = "tether-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "Shared logic for the Tether apps: adb, scrcpy, app cache, settings"

[lib]
name = "tether_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[profile.release]
lto = true
strip = true
